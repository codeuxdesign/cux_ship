# The rules for every package here, in one place.
#
# package:lints rather than package:flutter_lints because all four packages are
# pure Dart and none of them depends on Flutter — `dart analyze` and
# `dart format` both fail to resolve a flutter_lints include before they do
# anything else.
#
# Each package includes this file rather than repeating it. Before extraction
# they each carried their own copy with a comment asking the next person to keep
# them in step by hand, because the app they lived in had a Flutter root they
# could not inherit from. That constraint is gone, so the copies are too.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # An unused local is usually a dropped term rather than a tidy-up nobody got
    # to.
    unused_local_variable: error
    unused_import: error
    # Dead null-aware code usually means a nullability assumption drifted.
    dead_null_aware_expression: error

linter:
  rules:
    - always_declare_return_types
    # These two together are what force braces on single-statement bodies.
    # curly_braces_in_flow_control_structures alone exempts a one-line `if`
    # with no else, which is exactly the case being ruled out here.
    - always_put_control_body_on_new_line
    - curly_braces_in_flow_control_structures
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - omit_local_variable_types
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - sort_pub_dependencies
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_super_parameters
