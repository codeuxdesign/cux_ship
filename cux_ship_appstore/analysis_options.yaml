# Mirrors the repository root's analysis_options.yaml, with one change: it
# includes package:lints rather than package:flutter_lints, because this package
# is pure Dart and does not depend on Flutter. Inheriting the root file directly
# is not possible for the same reason — `dart analyze` and `dart format` both
# fail to resolve the flutter_lints include before they do anything else.
#
# Everything below is kept identical to the root on purpose. If a rule changes
# there, change it here too; the two are meant to agree.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # The physics core is numeric; an unused local is almost always a dropped term.
    unused_local_variable: error
    unused_import: error
    # Dead null-aware code usually means a nullability assumption drifted.
    dead_null_aware_expression: error

linter:
  rules:
    - always_declare_return_types
    # These two together are what force braces on single-statement bodies.
    # curly_braces_in_flow_control_structures alone exempts a one-line `if`
    # with no else, which is exactly the case being ruled out here.
    - always_put_control_body_on_new_line
    - curly_braces_in_flow_control_structures
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - omit_local_variable_types
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - sort_pub_dependencies
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_super_parameters
