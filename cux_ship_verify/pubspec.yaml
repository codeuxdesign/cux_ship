name: cux_ship_verify
description: >-
  The offline half of shipping to the App Store and Google Play: the CHANGELOG
  parser, the App Store metadata tree, and the checks that catch what either
  store would otherwise reject only after an upload.
repository: https://github.com/codeuxdesign/cux_ship
version: 1.6.0

# **No dependencies, and that is the design.** This is the package a consuming
# project puts in its own dev_dependencies so the checks run in its test suite
# on every push — so what it drags into a contributor's lockfile matters. It
# drags nothing.
#
# That is why the changelog parser and the App Store metadata loader live here
# rather than beside the uploaders that also use them. Both are pure `dart:io`
# and `dart:convert`, both are the *model* of a store input rather than a client
# for one, and putting them here is what lets `package:cux_ship` depend on this
# instead of the other way round. The alternative — a consumer reaching the
# checks through the CLI package — puts googleapis and an image codec in the
# lockfile of anyone who wanted to know whether a release note is too long.
#
# The checks it holds used to be test cases inside the uploader packages,
# reading ../../CHANGELOG.md and ../../store/appstore — which worked only while
# those packages lived inside the app that owned those files. Extracting them
# broke that, and the fix was not to delete the guards: a guard that only ever
# sees fixtures is worth nothing. So the logic lives here and the data stays in
# the consumer.
environment:
  sdk: ^3.12.2

resolution: workspace

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
