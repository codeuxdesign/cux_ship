name: cux_ship
description: >-
  One command for shipping to the App Store and Google Play: upload an artifact,
  publish the store listing, and promote a build a store already holds.
repository: https://github.com/codeuxdesign/cux_ship
issue_tracker: https://github.com/codeuxdesign/cux_ship/issues
version: 3.4.1

topics:
  - app-store
  - google-play
  - release
  - ci

# Declared rather than left to pub's inference from bin/, so `dart pub global
# activate cux_ship` plainly gives a `cux_ship` command and pub.dev says so.
executables:
  cux_ship:

# The command, and everything behind it. The App Store and Play clients are
# `lib/src/appstore/` and `lib/src/play/` — libraries this wires together, which
# is what makes `cux_ship appstore upload` possible where there used to be one
# executable per package and an invocation that named the package twice.
#
# **Two packages, and the split is about what a consumer's lockfile gets.**
# Everything heavy is here: googleapis for the Play resumable upload, an image
# codec for the alpha channel Apple refuses, an HTTP client and a JWT signer.
# A project's *release tooling* wants all of it. A project's *test suite* wants
# none of it, and only wants to know whether its changelog and store tree would
# be accepted — so those checks, and the two pure models they are built on, are
# in cux_ship_verify, which has no dependencies at all.
#
# lib/verify.dart re-exports cux_ship_verify so an existing consumer keeps
# working, but a test suite should depend on cux_ship_verify directly: reaching
# the checks through this package is what puts googleapis in the lockfile of
# somebody who wanted to count characters in a release note.
environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  args: ^2.4.0
  # For `deps install`, which verifies a download against a pinned hash before
  # it is moved into place and made executable. That check is the difference
  # between pinning "some build of 3.13.3" and pinning a specific one — and
  # separately for the MD5 that App Store Connect requires as a screenshot's
  # sourceFileChecksum. Not a security choice there; Apple picked it.
  crypto: ^3.0.0
  # **The oldest version that works, not the newest.** Bumping this in lockstep
  # with cux_ship's own version makes the repository unresolvable as a git
  # dependency for the whole window between the commit and the publish — the
  # constraint names a version that does not exist on pub.dev yet, and CI's
  # consumer probe goes red every release. Raise it only when something here
  # actually needs a newer cux_ship_verify.
  cux_ship_verify: ^1.9.0
  # ES256 over the .p8 private key. App Store Connect accepts nothing else, and
  # package:crypto has no ECDSA, so this or pointycastle-by-hand were the
  # options.
  dart_jsonwebtoken: ^3.0.0
  # androidpublisher_v3 is the Play Developer Publishing API, generated from
  # Google's discovery document. Worth the size: it handles the resumable media
  # upload for a 45 MB bundle, which is the one genuinely fiddly part of this.
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0
  http: ^1.2.0
  # Only `screenshots flatten` uses this, and only to re-encode a PNG without
  # its alpha channel — which every screen capture has and Apple rejects. It
  # earns a dependency because the alternative was asking everyone who captures
  # a screenshot to install ImageMagick: `sips` cannot do it while staying PNG,
  # and this is pure Dart.
  image: ^4.2.0
  # For --app-dir, which has to decide whether one directory is inside another
  # and what its path is relative to it. String surgery gets `..`, trailing
  # slashes and symlinks wrong, and a wrong answer there is a `git commit`
  # naming a path that does not exist.
  path: ^1.9.0
  # **Versions are parsed into `Version`, not compared as strings.** The bump
  # path hand-rolled `^(\d+)\.(\d+)\.(\d+)$` and did its own arithmetic, which
  # works and says nothing about ordering — 1.0.10 against 1.0.9 is a string
  # comparison away from being wrong, and the `+build` metadata this project's
  # tag scheme depends on being excluded from precedence is a semver rule rather
  # than something to reimplement.
  #
  # Parsing at the boundary also separates two things the regex conflated: what
  # is a valid version, and which valid versions this tool will bump. The second
  # is stricter than semver on purpose and is now stated as a policy on typed
  # fields rather than as a pattern that happens to exclude them.
  pub_semver: ^2.1.4

  # For .cux-ship.yaml and for the decrypted secrets file. A hand-written parser
  # would do for one flat key, but both are read before a command does anything
  # and both report their own syntax errors with a line number, which is the
  # half that matters when they are wrong.
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
