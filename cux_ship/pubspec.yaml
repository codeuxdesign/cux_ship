name: cux_ship
description: >-
  One command for shipping to the App Store and Google Play: upload an artifact,
  publish a listing, promote a build a store already holds, and check the
  release inputs a store would otherwise reject after the upload.
publish_to: 'none'
version: 1.1.0

# The single entry point. Everything else here is a library it wires together,
# which is what makes `cux_ship appstore upload` possible where there used to be
# one executable per package and an invocation that named the package twice.
#
# It is also the only package a consumer needs to depend on. That is not just
# convenience: pub treats a git dependency's ref as part of its identity without
# resolving a tag first, so a package that is both a direct dependency (at a
# tag) and a transitive one (at the commit a relative path: resolved to) is an
# unsolvable conflict. One direct dependency has no second identity to collide
# with, which is why consumers can pin a readable tag again.
#
# lib/verify.dart re-exports cux_ship_verify for the same reason: a consumer's
# tests can import it without naming a second package here.
environment:
  sdk: ^3.12.2

dependencies:
  args: ^2.4.0
  cux_ship_appstore:
    path: ../cux_ship_appstore
  cux_ship_play:
    path: ../cux_ship_play
  cux_ship_verify:
    path: ../cux_ship_verify

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
