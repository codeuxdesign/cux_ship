name: cux_ship_play
description: >-
  Uploads a signed .aab to a Google Play track. Invoked by tool/upload.sh; not
  part of the app.
publish_to: 'none'
version: 1.0.0

# Its own package rather than a script under tool/ in the app. googleapis is a
# very large generated package covering every Google API, and there is no reason
# for it to appear in the app's lockfile or its dependency graph. Keeping it
# separate also means this directory can be copied to another project whole.
environment:
  sdk: ^3.12.2

dependencies:
  args: ^2.4.0
  # The changelog parser, which used to live here as lib/changelog.dart. Moved
  # out when tool/asc_upload appeared and needed the same rules with a different
  # platform — the alternative was the App Store uploader depending on the Play
  # one, which is not a relationship either of them has.
  cux_ship_notes:
    path: ../cux_ship_notes
  # androidpublisher_v3 is the Play Developer Publishing API, generated from
  # Google's discovery document. Worth the size: it handles the resumable media
  # upload for a 45 MB bundle, which is the one genuinely fiddly part of this.
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0

dev_dependencies:
  lints: ^6.0.0
