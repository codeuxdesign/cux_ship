name: cux_ship_play
description: >-
  Uploads a signed .aab to a Google Play track. Driven by a consuming project's
  release scripts; it is a tool, not a library an application links against.
publish_to: 'none'
version: 1.0.0

# Its own package rather than a script inside the app it releases. googleapis is
# a very large generated package covering every Google API, and there is no
# reason for it to appear in that app's lockfile or its dependency graph.
environment:
  sdk: ^3.12.2

dependencies:
  args: ^2.4.0
  # The changelog parser, which used to live here as lib/changelog.dart. Moved
  # out when the App Store uploader appeared and needed the same rules with a
  # different platform — the alternative was that uploader depending on this
  # one, which is not a relationship either of them has.
  cux_ship_notes:
    path: ../cux_ship_notes
  # androidpublisher_v3 is the Play Developer Publishing API, generated from
  # Google's discovery document. Worth the size: it handles the resumable media
  # upload for a 45 MB bundle, which is the one genuinely fiddly part of this.
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0

dev_dependencies:
  lints: ^6.0.0
