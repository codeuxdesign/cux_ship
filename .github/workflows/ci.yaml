name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A matrix over every package here. Adding a package means adding it to this
  # list *and* to the root pubspec's `workspace:` — two places, and pub fails
  # loudly on the second, which is what keeps them in step.
  # **The matrix is read from the workspace list rather than written out here.**
  #
  # It used to be a literal `[cux_ship_verify, cux_ship]`, six lines above a
  # comment explaining that the test step keys off the directory existing
  # "so a suite added to either one runs from the moment it is written and
  # cannot be silently skipped". That reasoning was right and was applied one
  # level too low: adding a *package* skipped it entirely, and the board stayed
  # green while nothing checked it. Which is what happened — `cux_buildnumber`
  # landed with format, analyze and 30 tests, and CI reported success without
  # running any of them.
  #
  # A package cannot now be added without being checked, because the same list
  # that makes it part of the workspace is the list this reads.
  packages:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        run: |
          set -euo pipefail
          list=$(awk '/^workspace:/{f=1;next} f&&/^  - /{print $2; next} f&&NF&&!/^ /{exit}' pubspec.yaml |
            python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          # Loudly, because an empty matrix is a workflow that passes having run
          # nothing — the same shape as the bug this job exists to prevent.
          [ "$list" != "[]" ] || { echo "no workspace members found in pubspec.yaml" >&2; exit 1; }
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "checking: $list"

  package:
    name: ${{ matrix.package }}
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.list) }}
    steps:
      - uses: actions/checkout@v5
      # **Pinned, and pinned to what Flutter ships rather than to latest.**
      #
      # Unpinned means "latest stable", so a Dart release changes what this
      # check asserts without anyone touching the repository — which is how CI
      # went red for a week: 3.13 reformatted two files that 3.12 considered
      # clean, so `dart format` passed for every contributor and failed on
      # every push, and nobody could notice because the board was already red
      # for an unrelated reason.
      #
      # 3.13.0 is what Flutter 3.47 stable bundles, and every consumer of this
      # package is a Flutter app — so this is the formatter their contributors
      # actually run. Bump it deliberately when Flutter does.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0

      # From the workspace root, because that is where the single lockfile is.
      # `pub get` inside a member refuses with "is part of a workspace" rather
      # than resolving something subtly different, which is the right failure.
      - run: dart pub get

      # **A stale `.g.dart` analyzes clean, which is the whole problem.** The
      # generated code is committed so that neither a consumer nor
      # `dart pub publish` ever runs a generator; the cost is that editing an
      # annotated class and forgetting to regenerate leaves valid Dart that
      # describes the class as it used to be. So it is regenerated here and the
      # tree is asked whether anything moved.
      #
      # Conditioned on the member declaring build_runner rather than on its
      # name, so a second member that starts generating is covered from the
      # moment it does.
      # Asked the same way tool/check.sh asks it — whether regenerating changes
      # anything, rather than whether the tree differs from git. The tree is
      # clean here and both would work; they agree so that a green local run
      # predicts a green one here, which is the whole point of that script.
      - name: Generated code is current
        run: |
          set -euo pipefail
          if grep -q '^  build_runner:' pubspec.yaml; then
            generated() { find lib -name '*.g.dart' -exec shasum {} \; | sort; }
            before=$(generated)
            dart run build_runner build > /dev/null
            [ "$before" = "$(generated)" ] || {
              echo "generated code is not what the sources produce" >&2
              git --no-pager diff -- lib
              exit 1
            }
          fi
        working-directory: ${{ matrix.package }}

      - run: dart format --output=none --set-exit-if-changed .
        working-directory: ${{ matrix.package }}
      - run: dart analyze --fatal-infos
        working-directory: ${{ matrix.package }}

      # The condition is on the directory existing rather than on a list of
      # package names, so a suite added to either one runs from the moment it is
      # written and cannot be silently skipped.
      - name: Test
        if: hashFiles(format('{0}/test/**', matrix.package)) != ''
        run: dart test --reporter expanded
        working-directory: ${{ matrix.package }}

      # Publishing is permanent — a retraction is a seven-day window, not an
      # undo — so the metadata that gates it is checked on every push rather
      # than discovered at release time. --dry-run needs no credentials.
      - name: Would publish
        run: dart pub publish --dry-run
        working-directory: ${{ matrix.package }}

      # **Every `[reference]` in the dartdoc resolves to something.**
      # `documents.dart`'s dartdoc *is* the published statement of the `--json`
      # format — pub.dev renders it per version and it is the only place a
      # consumer can read the format without reading an encoder — so a link
      # that resolves to nothing is a specification pointing at a name the
      # reader cannot follow. `dart analyze` cannot see it; a doc comment is a
      # comment. Second occurrence: the first was an orphaned `///` block found
      # by a consumer reading the published dev.2, and the test that came out
      # of it catches a block attached to nothing, not a link that dangles.
      #
      # **The command lives in tool/check.sh, and this invokes it.** Not
      # because the step is long, but because restating it here is the
      # two-places drift that script exists to remove, and because a guard has
      # to be watched failing (docs/CONTRIBUTING.md) — which needs a command a
      # contributor can run, not a yaml step that only exists after a push.
      #
      # The asymmetry is *when* rather than *where*: `dart doc` costs about
      # ninety-five seconds on cux_ship against ninety for the whole five-step
      # suite, so a default local run skips it and this never does. Locally it
      # is `tool/check.sh --docs`, or this line verbatim.
      - name: Doc references resolve
        run: tool/check.sh --docs-only ${{ matrix.package }}

  # The check a consumer actually depends on: that this repository can be
  # resolved as a git dependency, from a clean checkout, with no credentials.
  # It is public precisely so that this needs no token.
  #
  # Worth its own job because the failure it catches is invisible locally —
  # everything resolves on a machine where the sibling directories already
  # exist, and breaks only for someone cloning fresh.
  consume:
    name: Resolve as a git dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # **Pinned, and pinned to what Flutter ships rather than to latest.**
      #
      # Unpinned means "latest stable", so a Dart release changes what this
      # check asserts without anyone touching the repository — which is how CI
      # went red for a week: 3.13 reformatted two files that 3.12 considered
      # clean, so `dart format` passed for every contributor and failed on
      # every push, and nobody could notice because the board was already red
      # for an unrelated reason.
      #
      # 3.13.0 is what Flutter 3.47 stable bundles, and every consumer of this
      # package is a Flutter app — so this is the formatter their contributors
      # actually run. Bump it deliberately when Flutter does.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0

      # One dependency, exactly as a consumer declares it. Deliberately resolved
      # against the commit under test rather than a tag, so a change that would
      # break consumers fails here rather than after it has been tagged.
      #
      # On a pull request that commit is the branch head, not github.sha. The
      # latter is the merge commit GitHub synthesises at refs/pull/N/merge,
      # which is reachable by actions/checkout and by nothing else — a plain
      # clone of the public url cannot see it, so pub resolves it to "fatal:
      # bad object" and this job fails for every pull request regardless of its
      # contents. Only ever green before because it had only ever run on push.
      #
      # This checks that the branch is consumable rather than that main will be
      # after merging; the push run on main covers the latter.
      - name: Build a throwaway consumer
        run: |
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          cat > pubspec.yaml <<EOF
          name: consumer_probe
          publish_to: 'none'
          environment:
            sdk: ^3.12.2
          dependencies:
            cux_ship:
              git:
                url: https://github.com/${{ github.repository }}.git
                path: cux_ship
                ref: ${{ github.event.pull_request.head.sha || github.sha }}
          EOF
          dart pub get

      # `cux_ship` names `cux_ship_verify` as a *hosted* constraint, because a
      # published package may not carry a path dependency. So a git consumer of
      # this repository resolves the CLI from the commit under test and its
      # sibling from pub.dev — which is worth asserting rather than assuming,
      # since it is the one edge a workspace hides: everything resolves locally
      # here whether or not that package was ever published.
      #
      # This job carried a dependency_override until 11 August 2026, standing in
      # for the sibling while it was unpublished. Both are on pub.dev now and the
      # override is gone.
      - name: Confirm the other package resolved
        run: |
          cd /tmp/consumer
          grep -q cux_ship_verify pubspec.lock \
            || { echo "cux_ship_verify did not resolve"; exit 1; }

      # Every leaf of the tree renders its help without authenticating. This is
      # also the check that each subcommand's parser is constructible: a
      # duplicate option name throws when the Command is built, not when it runs.
      - name: Confirm the command runs without credentials
        run: |
          cd /tmp/consumer
          dart run cux_ship --help
          for c in upload promote builds versions screenshot-types build-number; do
            dart run cux_ship appstore "$c" --help > /dev/null
          done
          for c in upload promote tracks listing version-code; do
            dart run cux_ship play "$c" --help > /dev/null
          done
          dart run cux_ship release finish --help > /dev/null
          dart run cux_ship screenshots flatten --help > /dev/null
          for c in exec keys; do
            dart run cux_ship secrets "$c" --help > /dev/null
          done
          for c in install check update; do
            dart run cux_ship deps "$c" --help > /dev/null
          done
          dart run cux_ship verify --help > /dev/null

      # `deps check` is the one command that reports rather than acts, so it is
      # the one that can be run for real here: no credentials, no network, and a
      # non-zero exit is the correct answer on a runner with an empty .bin/.
      # It proves the pin lookup resolves on linux/amd64, which no laptop does.
      - name: Confirm the pins cover this runner
        run: |
          cd /tmp/consumer
          out=$(dart run cux_ship deps check || true)
          echo "$out"
          for tool in sops age; do
            echo "$out" | grep -q "^$tool " \
              || { echo "deps check said nothing about $tool"; exit 1; }
          done

      # Releasing with no terminal and no --yes must refuse rather than assume
      # yes. Asserted here because the failure mode is a CI job that silently
      # publishes, which is exactly what nobody would notice until it had.
      - name: Confirm an unattended release refuses
        run: |
          cd /tmp/consumer
          if dart run cux_ship play promote --package com.example.nothing < /dev/null; then
            echo 'released unattended without --yes'
            exit 1
          fi
