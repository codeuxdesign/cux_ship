name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A matrix over every package here. Adding a package means adding it to this
  # list — that is the whole wiring, and there is no second place to remember.
  package:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [cux_ship_notes, cux_ship_play, cux_ship_appstore, cux_ship_verify, cux_ship]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos

      # Conditional because cux_ship_play has no test/ directory: its logic
      # moved to cux_ship_notes, and what is left is API calls. The condition is
      # on the directory existing rather than on a list of package names, so a
      # suite added to any of them runs from the moment it is written and cannot
      # be silently skipped.
      - name: Test
        if: hashFiles(format('{0}/test/**', matrix.package)) != ''
        run: dart test --reporter expanded

  # The check a consumer actually depends on: that this repository can be
  # resolved as a git dependency, from a clean checkout, with no credentials.
  # It is public precisely so that this needs no token.
  #
  # Worth its own job because the failure it catches is invisible locally —
  # everything resolves on a machine where the sibling directories already
  # exist, and breaks only for someone cloning fresh.
  consume:
    name: Resolve as a git dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1

      # One dependency, exactly as a consumer declares it. Deliberately resolved
      # against the commit under test rather than a tag, so a change that would
      # break consumers fails here rather than after it has been tagged.
      #
      # On a pull request that commit is the branch head, not github.sha. The
      # latter is the merge commit GitHub synthesises at refs/pull/N/merge,
      # which is reachable by actions/checkout and by nothing else — a plain
      # clone of the public url cannot see it, so pub resolves it to "fatal:
      # bad object" and this job fails for every pull request regardless of its
      # contents. Only ever green before because it had only ever run on push.
      #
      # This checks that the branch is consumable rather than that main will be
      # after merging; the push run on main covers the latter.
      - name: Build a throwaway consumer
        run: |
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          cat > pubspec.yaml <<EOF
          name: consumer_probe
          publish_to: 'none'
          environment:
            sdk: ^3.12.2
          dependencies:
            cux_ship:
              git:
                url: https://github.com/${{ github.repository }}.git
                path: cux_ship
                ref: ${{ github.event.pull_request.head.sha || github.sha }}
          EOF
          dart pub get

      # The relative path: dependencies between the packages are the mechanism
      # the whole arrangement rests on: one direct dependency has to pull the
      # other four. Confirm rather than assume.
      - name: Confirm the rest resolved transitively
        run: |
          cd /tmp/consumer
          for p in cux_ship_notes cux_ship_verify cux_ship_appstore cux_ship_play; do
            grep -q "$p" pubspec.lock \
              || { echo "$p did not resolve transitively"; exit 1; }
          done

      # Every leaf of the tree renders its help without authenticating. This is
      # also the check that each subcommand's parser is constructible: a
      # duplicate option name throws when the Command is built, not when it runs.
      - name: Confirm the command runs without credentials
        run: |
          cd /tmp/consumer
          dart run cux_ship --help
          for c in upload promote builds versions screenshot-types build-number; do
            dart run cux_ship appstore "$c" --help > /dev/null
          done
          for c in upload promote tracks listing version-code; do
            dart run cux_ship play "$c" --help > /dev/null
          done
          dart run cux_ship release finish --help > /dev/null
          dart run cux_ship screenshots flatten --help > /dev/null
          dart run cux_ship verify --help > /dev/null

      # Releasing with no terminal and no --yes must refuse rather than assume
      # yes. Asserted here because the failure mode is a CI job that silently
      # publishes, which is exactly what nobody would notice until it had.
      - name: Confirm an unattended release refuses
        run: |
          cd /tmp/consumer
          if dart run cux_ship play promote --package com.example.nothing < /dev/null; then
            echo 'released unattended without --yes'
            exit 1
          fi
